[package]
name = "shenlun-ai-trainer"
version = "0.1.0"
description = "Local-first Shenlun training assistant"
authors = ["Shenlun AI Trainer"]
edition = "2021"

[lib]
name = "shenlun_ai_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.1.6"
reqwest = { version = "0.13.4", features = ["json"] }